<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#050505;padding:24px 0;font-family:Arial,Helvetica,sans-serif;color:#f9f9f9">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background-color:#0e0e0e;border:1px solid rgba(201,168,76,0.25);padding:32px">
        <tr>
          <td align="center" style="padding-bottom:24px">
            <img src="https://media.base44.com/images/public/6a5537674461cdc7bdad66cf/602d336b8_Untitleddesign1.png" alt="Frensic Luxury Apartment" width="180" style="display:block;width:180px;max-width:100%;height:auto;border:0;outline:none;text-decoration:none" />
          </td>
        </tr>
        <tr>
          <td align="center">
            <h2 style="margin:0 0 12px;font-size:24px;font-weight:600;color:#f9f9f9">Confirm your email address</h2>
            <p style="margin:0 0 16px;font-size:14px;line-height:1.6;color:#aaaaaa">Use this code to confirm your email and view your Frensic Luxury bookings.</p>
            <p style="margin:0 0 24px;font-size:30px;letter-spacing:6px;font-weight:700;color:#c9a84c">{{ .Token }}</p>
            <p style="margin:0 0 12px;font-size:14px;color:#aaaaaa">You can also confirm instantly using the secure link below:</p>
            <p style="margin:0 0 24px">
              <a href="{{ .ConfirmationURL }}" style="display:inline-block;background-color:#c9a84c;color:#050505;padding:12px 24px;font-size:13px;font-weight:700;letter-spacing:1px;text-decoration:none;text-transform:uppercase">Confirm email address</a>
            </p>
            <p style="margin:0;font-size:12px;line-height:1.6;color:#777777">If you did not request this, you can safely ignore this email.</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
